name: Install
description: Install the mise tools and npm dependencies of a checked-out repo.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2026.10.18
        cache: false
    - uses: actions/cache@v6
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: npm-${{ runner.os }}-
    - run: npm ci
      shell: bash
