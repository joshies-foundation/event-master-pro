name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SUPABASE_TEST_REF: jdwvtjrhfsciqttiueud
  SUPABASE_PROD_REF: bbptbpmmfformxfzkdgl

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  plan-migrations:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    outputs:
      pending: ${{ steps.dry-run.outputs.pending }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - name: List the migrations pending on PROD
        id: dry-run
        run: |
          plan=$(npx supabase db push --dry-run --skip-vault --yes --output-format json --project-ref "$SUPABASE_PROD_REF" </dev/null)
          pending=$(jq -n 'input.upToDate | if type == "boolean" then not else error("upToDate is not a boolean") end' <<<"$plan")
          echo "pending=$pending" >>"$GITHUB_OUTPUT"
          jq -r 'if .upToDate then "No migrations are pending on PROD." else "Migrations pending on PROD:", "", (.migrations[] | "- `\(.)`") end' <<<"$plan" >>"$GITHUB_STEP_SUMMARY"

  migrate:
    needs: plan-migrations
    if: needs.plan-migrations.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-database
    # Separate from deploy-production because a concurrency group keeps only
    # its newest queued job, and a later deploy must not cancel a queued migrate.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - name: Push migrations to TEST
        run: npx supabase db push --skip-vault --yes --project-ref "$SUPABASE_TEST_REF" </dev/null
      - name: Push migrations to PROD
        run: npx supabase db push --skip-vault --yes --project-ref "$SUPABASE_PROD_REF" </dev/null

  deploy:
    needs: [plan-migrations, migrate]
    if: ${{ !cancelled() && needs.plan-migrations.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://joshies.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NG_APP_SUPABASE_PROJECT_ID: ${{ vars.NG_APP_SUPABASE_PROJECT_ID }}
      NG_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NG_APP_SUPABASE_PUBLISHABLE_KEY }}
      NG_APP_VAPID_PUBLIC_KEY: ${{ vars.NG_APP_VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install
      - name: Check the build variables
        run: |
          for name in NG_APP_SUPABASE_PROJECT_ID NG_APP_SUPABASE_PUBLISHABLE_KEY NG_APP_VAPID_PUBLIC_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is empty in this environment"; exit 1; }
          done
      - run: npm run deploy </dev/null
      - name: Check the live site
        run: |
          for path in / /home /rules /ngsw.json; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 \
              --output /dev/null "https://joshies.app$path"
          done
          curl --fail --silent https://joshies.app/home | grep -q '<joshies-root'
          curl --fail --silent https://joshies.app/ngsw.json | grep -q '"hashTable"'
