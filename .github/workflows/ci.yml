name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx eslint e2e playwright.config.ts
      - run: npx tsc -p e2e
      - name: Build
        run: cp .env.example .env && npm run build
      - name: Start the local Supabase stack
        env:
          # The default registry, public.ecr.aws, throttles the shared runner IPs.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor,mailpit </dev/null
      - run: npx playwright install --with-deps webkit
      - run: npm run e2e -- --project=iphone
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://joshies.app
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NG_APP_SUPABASE_PROJECT_ID: ${{ vars.NG_APP_SUPABASE_PROJECT_ID }}
      NG_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NG_APP_SUPABASE_PUBLISHABLE_KEY }}
      NG_APP_VAPID_PUBLIC_KEY: ${{ vars.NG_APP_VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the build variables
        run: |
          for name in NG_APP_SUPABASE_PROJECT_ID NG_APP_SUPABASE_PUBLISHABLE_KEY NG_APP_VAPID_PUBLIC_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is empty in this environment"; exit 1; }
          done
      - run: npm run deploy </dev/null
      - name: Check the live site
        run: |
          for path in / /home /rules /ngsw.json; do
            curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 10 \
              --output /dev/null "https://joshies.app$path"
          done
          curl --fail --silent https://joshies.app/home | grep -q '<joshies-root'
          curl --fail --silent https://joshies.app/ngsw.json | grep -q '"hashTable"'

  preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NG_APP_SUPABASE_PROJECT_ID: ${{ vars.NG_APP_SUPABASE_PROJECT_ID }}
      NG_APP_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NG_APP_SUPABASE_PUBLISHABLE_KEY }}
      NG_APP_VAPID_PUBLIC_KEY: ${{ vars.NG_APP_VAPID_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the build variables
        run: |
          for name in NG_APP_SUPABASE_PROJECT_ID NG_APP_SUPABASE_PUBLISHABLE_KEY NG_APP_VAPID_PUBLIC_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is empty in this environment"; exit 1; }
          done
      - name: Deploy the preview
        id: deploy
        run: |
          npm run build -- --configuration development
          CLOUDFLARE_PREVIEW_BUILD=true npm run build-worker
          npx cf previews deploy --prebuilt "pr-${{ github.event.pull_request.number }}" </dev/null > preview.json
          cat preview.json
          echo "url=$(jq -r '.preview_urls[0]' preview.json)" >> "$GITHUB_OUTPUT"
      - name: Link the preview on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none \
            --body "Preview: $URL (commit ${{ github.event.pull_request.head.sha }}). It uses the TEST Supabase project."
