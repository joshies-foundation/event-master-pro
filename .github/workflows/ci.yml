name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx eslint e2e playwright.config.ts
      - run: npx tsc -p e2e
      - name: Build
        run: cp .env.example .env && npm run build
      - name: Start the local Supabase stack
        run: npm run start-supabase
      - run: npx playwright install --with-deps webkit
      - run: npm run e2e -- --project=iphone
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
